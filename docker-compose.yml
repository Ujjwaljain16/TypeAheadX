version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: typeaheadx
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d typeaheadx"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis-a:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  redis-b:
    image: redis:7-alpine
    ports:
      - "6380:6379"

  redis-c:
    image: redis:7-alpine
    ports:
      - "6381:6379"

name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: typeaheadx
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 20
      redis-a:
        image: redis:7-alpine
        ports: ["6379:6379"]
      redis-b:
        image: redis:7-alpine
        ports: ["6380:6379"]
      redis-c:
        image: redis:7-alpine
        ports: ["6381:6379"]
    env:
      # The integration tests create/use database typeaheadx_test and FLUSH these (disposable) Redis nodes.
      TAX_TEST_PG_DSN: postgresql://postgres:postgres@localhost:5432/typeaheadx_test
      TAX_TEST_REDIS_NODES: localhost:6379,localhost:6380,localhost:6381
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements-lock.txt
      - name: Install pinned dependencies (verifies the lock file installs on Linux)
        run: pip install -r requirements-lock.txt
      - name: Tests (unit + integration against real PostgreSQL and Redis)
        run: python -m pytest tests -q -p no:cacheprovider --cov=app --cov-report=term
      - name: Static analysis
        run: |
          pip install bandit ruff pip-audit
          python -m bandit -q -r app
          python -m ruff check app --select F,B,S --ignore S101,S311,B008
          python -m pip_audit -r requirements-lock.txt --no-deps --disable-pip

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install (fails on non-Linux-installable pins, see audit finding F-20)
        run: npm ci --no-audit --no-fund
      - run: npx tsc --noEmit
      - name: Lint (2 pre-existing react-hooks/set-state-in-effect errors are tracked, not gating yet)
        run: npm run lint
        continue-on-error: true
      - run: npm run build
